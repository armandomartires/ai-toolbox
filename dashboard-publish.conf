# Where this repository's delivery dashboard is published. Each destination's
# CI builds the page from a full clone of the pushed branch. The local file
# (docs/dashboard.html, gitignored) is a preview, never uploaded (ADR-0029).
#
# Read by skills/project-workflow/scripts/publish-dashboard.sh, which renders
# one CI pipeline per target from the skill's templates. tests/validate.sh runs
# `render --check`, so the rendered files cannot drift from their templates.
# After editing this file: bash skills/project-workflow/scripts/publish-dashboard.sh render
#
# github-pages runs on the `github` mirror; gitlab-pages on `origin` (ADR-0028).
targets      = github-pages gitlab-pages
skill_dir    = skills/project-workflow
branch       = master
root         = .ai
expect_shape = numbered_task

# A status label moves only against an observed run, and names it.
status.github-pages = VERIFIED on run 36608693753 (36ac929, push): success, guard reported 266 commits and a full clone, page HTTP 200 (TASK-0127)
status.gitlab-pages = UNVERIFIED - CI lint valid; pipeline 10 (36ac929) created its pages job, which stays pending: no runner is online (TASK-0127)
