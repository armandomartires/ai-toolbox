<!DOCTYPE html>
<!-- Generated by skills/project-workflow/scripts/build-dashboard.sh.
     Self-contained on purpose: no CDN, no external font, no network call of
     any kind. It opens by double-click from file://, survives being emailed,
     archived or committed, and still renders in five years. Regenerate it;
     do not hand-edit it. -->
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — delivery dashboard</title>
<style>{{BASE_CSS}}</style>
<style id="custom-css">{{CUSTOM_CSS}}</style>{{CSS_LINK}}
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="titles">
      <h1 id="proj-name">&nbsp;</h1>
      <p class="sub" id="proj-sub">&nbsp;</p>
    </div>
    <div class="controls">
      <button class="btn" id="theme-btn" type="button" aria-live="polite">Theme</button>
      <button class="btn" id="tables-btn" type="button" aria-pressed="false">Show all tables</button>
      <button class="btn" id="print-btn" type="button">Print</button>
    </div>
  </header>

  <!-- One filter row, above everything it scopes. Every chart, tile and table
       below re-renders against the same slice, so the numbers always agree. -->
  <div class="filters" role="group" aria-label="Filters">
    <label for="f-range">Range</label>
    <select id="f-range">
      <option value="all" selected>All time</option>
      <option value="90">Last 90 days</option>
      <option value="30">Last 30 days</option>
      <option value="14">Last 14 days</option>
      <option value="7">Last 7 days</option>
    </select>
    <label for="f-sprint">Sprint</label>
    <select id="f-sprint"><option value="">All</option></select>
    <label for="f-status">Status</label>
    <select id="f-status"><option value="">All</option></select>
    <label for="f-search" class="sr-only">Search</label>
    <input id="f-search" type="search" placeholder="Search id or title…">
    <span class="spacer"></span>
    <span class="scope" id="f-scope"></span>
    <button class="btn" id="f-reset" type="button">Reset</button>
  </div>

  <nav class="tabs" role="tablist" aria-label="Dashboard sections" id="tabs"></nav>
  <main id="panels"></main>

  <footer class="foot" id="foot"></footer>
</div>

<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script type="application/json" id="model">{{DATA}}</script>
<script>{{SCRIPT}}</script>
</body>
</html>
