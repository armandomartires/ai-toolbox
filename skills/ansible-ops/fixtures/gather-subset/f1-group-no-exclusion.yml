# negative fixture (see fixture 6).
- name: Gather facts against the PVE cluster group (hazardous)
  hosts: pve_cluster
  gather_facts: true
  tasks:
    - name: Something harmless after the damage is already done
      ansible.builtin.debug:
        msg: "the hazard is the fact gathering above, not this task"
