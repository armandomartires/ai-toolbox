# Open a GitHub Issue when a workflow fails, and close it when CI recovers.
#
# STATUS: VERIFIED. All three paths exercised on 2026-09-28, each read back
# from the API rather than inferred:
#   36443923514  dispatch failure  -> OPENED issue #1
#   36443928448  workflow_run      -> a REAL green `validate` on 2bfda15
#                                     commented "Recovered" and CLOSED #1.
#                                     Not a simulation: the live trigger.
#   36443970361  workflow_run      -> real green `dashboard`, nothing open,
#                                     nothing done
#   36444043239  dispatch failure  -> OPENED #2
#   36444075034  dispatch failure  -> COMMENTED "Still failing" on #2 and
#                                     created NO second issue (#2 comments
#                                     1 -> 2, issue count unchanged)
#   36444136192  dispatch success  -> CLOSED #2, state_reason `completed`,
#                                     0 issues left open
# Issues #1 and #2 are the test artifacts and are left closed as the record.
# Same rule as the other two workflows: this label moves only against a real
# run, and names it.
#
# WHY THIS EXISTS (TASK-0123, TASK-0124): validate was red for FOURTEEN
# consecutive commits and nobody knew. GitHub's own failure email defaults to
# on, so it was almost certainly already sending and already being missed --
# turning on a channel that has already failed is not a fix. There is also no
# REST API for that setting (404 on the notification endpoints, 403 on
# /user/emails), so it can be neither verified nor tested from a script. An
# alert nobody can test is the same class of thing as a gate nobody reads.
#
# WHY AN ISSUE AND NOT SMTP: no secret and no dependency. GITHUB_TOKEN with
# `issues: write` is already in the runner, where SMTP would mean credentials
# in the secrets of a PUBLIC repository whose first security rule is never to
# commit one, plus a marketplace action where ADR-0021 says third-party
# extensions are wired and not vendored. Every call below is curl + python3
# against the REST API.
#
# AND AN ISSUE IS DURABLE. It persists until closed, it sits beside the
# badges in the repo, and it is CLOSED AUTOMATICALLY when CI goes green --
# which makes it a state indicator rather than a notification. GitHub still
# emails about it through the normal path, so the human gets mail; the
# difference is that the record does not depend on the mail being read.
#
# ONE ISSUE, NOT ONE PER FAILURE. A fourteen-commit red streak must produce
# one thread with fourteen comments. The alternative gets muted, and a muted
# alert is exactly as useful as the unread email it replaced.
#
# `workflow_run` ONLY FIRES FOR THE FILE ON THE DEFAULT BRANCH. This cannot
# be tested from a side branch, and an edit here takes effect only once it is
# on master. That is why `workflow_dispatch` below carries a simulation:
# testing an alert by deliberately breaking master would put a real red
# commit in history to prove a notification works.
name: ci-alert

on:
  workflow_run:
    workflows: [validate, dashboard]
    types: [completed]
  workflow_dispatch:
    inputs:
      simulate:
        description: "Pretend a workflow reported this conclusion"
        required: true
        default: failure
        type: choice
        options: [failure, success]
      name:
        description: "Workflow name to report in the simulation"
        required: false
        default: validate

permissions:
  contents: read
  issues: write

# Serialised: two workflows finishing together must not both decide whether
# the issue exists. Not cancel-in-progress -- a cancelled alert is a missed
# one, which is the whole failure mode here.
concurrency:
  group: ci-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Open, comment on, or close the CI failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          EV: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TITLE_MSG: ${{ github.event.workflow_run.display_title }}
          SIM: ${{ inputs.simulate }}
          SIM_NAME: ${{ inputs.name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          # The fixed string that makes one issue findable again. Matched on
          # the title, not a label: creating a label is a second API call and
          # a second thing that can fail in an alert whose job is not to.
          MARKER = "[ci-alert] CI is failing on the default branch"

          API = os.environ["API"].rstrip("/")
          REPO = os.environ["REPO"]
          TOKEN = os.environ["GH_TOKEN"]

          simulated = os.environ.get("EV") == "workflow_dispatch"
          if simulated:
              conclusion = os.environ.get("SIM") or "failure"
              wf = os.environ.get("SIM_NAME") or "validate"
              run_url = "(simulated run - no URL)"
              sha, branch, subject = "0000000", "master", "simulated by workflow_dispatch"
          else:
              conclusion = os.environ.get("CONCLUSION") or ""
              wf = os.environ.get("WF_NAME") or "?"
              run_url = os.environ.get("RUN_URL") or ""
              sha = (os.environ.get("HEAD_SHA") or "")[:7]
              branch = os.environ.get("HEAD_BRANCH") or ""
              subject = os.environ.get("TITLE_MSG") or ""

          def call(method, path, payload=None):
              url = path if path.startswith("http") else "%s/%s" % (API, path)
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", "Bearer %s" % TOKEN)
              req.add_header("Accept", "application/vnd.github+json")
              if data:
                  req.add_header("Content-Type", "application/json")
              # No try/except around the call on purpose. If the API errors,
              # this job must FAIL LOUDLY. An alert that swallows its own
              # failure is another unread second opinion, which is the exact
              # defect this workflow exists to answer.
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8")
              return json.loads(body) if body.strip() else {}

          # A conclusion that is neither of these - cancelled, skipped,
          # timed_out - is not evidence either way, so nothing is touched.
          if conclusion not in ("failure", "success"):
              print("conclusion %r is not actionable; nothing to do" % conclusion)
              sys.exit(0)

          issues = call("GET", "repos/%s/issues?state=open&per_page=100" % REPO)
          existing = next((i for i in issues
                           if MARKER in i.get("title", "")
                           and "pull_request" not in i), None)

          where = "%s on `%s`" % (wf, branch or "?")
          detail = "\n".join([
              "- workflow: **%s**" % wf,
              "- conclusion: **%s**" % conclusion,
              "- commit: `%s` %s" % (sha, subject),
              "- run: %s" % run_url,
              "- simulated: %s" % ("yes - `workflow_dispatch`" if simulated else "no"),
          ])

          if conclusion == "failure":
              if existing:
                  call("POST", "repos/%s/issues/%d/comments" % (REPO, existing["number"]),
                       {"body": "Still failing - %s\n\n%s" % (where, detail)})
                  print("commented on #%d (no second issue)" % existing["number"])
              else:
                  body = (
                      "%s\n\n"
                      "This issue was opened automatically and will **close "
                      "itself** when `validate` and `dashboard` next report "
                      "success on the default branch. It exists because a red "
                      "gate once went unnoticed for fourteen commits "
                      "(`TASK-0123`); see `.github/workflows/ci-alert.yml` for "
                      "why it is an issue rather than an email.\n\n"
                      "Further failures are added as comments here rather than "
                      "as new issues." % detail)
                  made = call("POST", "repos/%s/issues" % REPO,
                              {"title": MARKER, "body": body})
                  print("opened #%d" % made["number"])
          else:
              if existing:
                  call("POST", "repos/%s/issues/%d/comments" % (REPO, existing["number"]),
                       {"body": "Recovered - %s\n\n%s" % (where, detail)})
                  call("PATCH", "repos/%s/issues/%d" % (REPO, existing["number"]),
                       {"state": "closed", "state_reason": "completed"})
                  print("closed #%d" % existing["number"])
              else:
                  print("green, and nothing was open; nothing to do")
          PY
