# Mandatory validation in CI.
#
# STATUS: VERIFIED. First ran 2026-09-13 on run #1 (commit ea5372e) and
# passed every step, including the registry-staleness check. The remote was
# added by TASK-0015 from environment-supplied credentials (ADR-0009); this
# label was UNVERIFIED until a run actually existed, and was changed only
# after observing one - not on the assumption that a green file is a green
# build.
#
# AND IT WENT RED WITHOUT ANYONE NOTICING. From TASK-0106 (2026-09-26) until
# TASK-0123 (2026-09-28) every run failed at `STANDARD:
# scripts/sync-decision-standard.sh failed` - at least fourteen consecutive
# commits - while the same gate passed locally every time. The cause was a
# file mode, not a check: this repo is developed on a /mnt/c checkout where
# core.filemode is false, so a script committed 100644 runs here and nowhere
# else. Green again on bd4160c. tests/validate.sh now fails on any tracked
# shebang file that is not recorded executable, which is the check that would
# have caught it on the day.
#
# The lesson is narrower than "watch CI": a second opinion nobody reads is
# not a second opinion. This header being right in 2026-09-13 did not keep
# it right.
#
# The primary gate is the local pre-commit hook (.githooks/pre-commit,
# activated by scripts/install.sh). This workflow is a redundant second
# check, not a replacement for the hook: the hook is what stops a bad
# commit from being made, CI only reports one that already was.
#
# Deliberately NOT run here: tests/smoke-mcp.sh. It fetches upstream
# packages over the network and reports SKIP as a distinct outcome from
# PASS; a CI job that treated SKIP as success would report green while
# verifying nothing. If it is ever added, it needs explicit SKIP handling.
name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # validate.sh parses server.json manifests with python3 and must
      # stay offline and hermetic (AGENTS.md, Commands).
      - name: Check prerequisites
        run: |
          bash --version | head -1
          python3 --version

      - name: Run mandatory validation
        run: bash tests/validate.sh

      # The registry is generated. If regenerating it produces a diff, the
      # committed copy is stale - the same check the release-check loop
      # performs by hand at step 3.
      - name: Confirm the registry is up to date
        run: |
          bash scripts/sync-registry.sh
          if ! git diff --quiet docs/registry.md; then
            echo "::error::docs/registry.md is stale - run scripts/sync-registry.sh and commit the result"
            git --no-pager diff docs/registry.md
            exit 1
          fi
