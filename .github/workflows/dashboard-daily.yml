# dashboard-publish.conf or the template, then run
#   bash skills/project-workflow/scripts/publish-dashboard.sh render
# `render --check` fails when this copy and its template disagree.
#
# STATUS: UNVERIFIED - no scheduled run observed yet (TASK-0129)
# The label moves only against an observed run, and names it.
#
# Rebuild the published dashboard once a day: dispatch the github-pages
# workflow, dashboard.yml, on master, then wait for that run and end as
# it ends. The page is dated by the day it is built, so a page rebuilt only on
# push keeps the date of the last push.
#
# A SEPARATE FILE ON PURPOSE. GitHub can disable an idle scheduled workflow,
# and a disabled workflow runs on no trigger at all, so a schedule inside
# dashboard.yml could take its push publishing down with it. Here only this
# file can stop. The limits GitHub puts on schedules, and how to re-enable
# this one: skills/project-workflow/references/dashboard.md, "Publishing it".
#
# WHY IT WAITS. The run it starts is triggered by this workflow's token, not
# by a person, so GitHub's failure notice may reach no one and a workflow_run
# listener may never hear of it. Mirroring its conclusion makes this run fail
# with it. A run that was cancelled - superseded by a newer run in the `pages`
# group, or by hand - is not a failure.
#
# 00:23 UTC: after midnight on the runner's UTC clock, whose date the page
# carries, and off the start of the hour (same reference).
name: dashboard-daily

on:
  schedule:
    - cron: '23 0 * * *'
  # The same path by hand, minus the clock.
  workflow_dispatch:

# Dispatching a workflow and reading its runs are both `actions`; every scope
# not named here is none.
permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Room for a run that queues behind another in the `pages` group.
    timeout-minutes: 30
    steps:
      # No checkout: the dispatched run clones master itself, at its tip.
      # API version pinned: under it the dispatch reply names the run it
      # started, which is the run this step waits on.
      - name: Dispatch dashboard.yml on master and wait for it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" "$@"
          }
          reply=$(api -X POST -d '{"ref":"master"}' \
            "$API/repos/$REPO/actions/workflows/dashboard.yml/dispatches") \
            || { echo "::error::dispatch refused: $reply"; exit 1; }
          run_id=$(printf '%s' "$reply" | python3 -c 'import json, sys; print(int(json.load(sys.stdin)["workflow_run_id"]))') \
            || { echo "::error::the dispatch reply names no run: $reply"; exit 1; }
          echo "dispatched run $run_id"
          while :; do
            sleep 15
            # A failed poll is retried; the job's timeout ends a lasting one.
            state=$(api "$API/repos/$REPO/actions/runs/$run_id" \
              | python3 -c 'import json, sys; r = json.load(sys.stdin); print(r["status"], r["conclusion"] or "-")') \
              || { echo "poll of run $run_id failed; retrying"; continue; }
            echo "run $run_id: $state"
            case "$state" in
              "completed success") exit 0 ;;
              "completed cancelled")
                echo "run $run_id was cancelled: superseded in the pages group, or by hand"
                exit 0 ;;
              completed\ *)
                echo "::error::dispatched run $run_id concluded ${state#completed }"
                exit 1 ;;
            esac
          done
