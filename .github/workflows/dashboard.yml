# The label moves only against an observed run, and names it.
#
# Regenerate the delivery dashboard and publish it to GitHub Pages. This
# pipeline's build, from a full clone of the pushed branch, is the published
# page; a local build is a preview and is never uploaded.
#
# SEPARATE FROM ANY GATE WORKFLOW ON PURPOSE. A gate runs on every branch and
# every pull request, and its token stays narrow. This runs on the default
# branch only and needs `pages: write` plus an `id-token`. Folding the two
# together would put a deploy permission on the job that runs for every PR,
# including one from a fork.
#
# THE DASHBOARD IS A VIEW, NOT A GATE. A failed deploy fails this workflow; a
# dashboard reporting uncomfortable numbers fails nothing, because it renders
# what the artifacts say and audits nothing. Nothing here may ever become a
# condition on a commit.
name: dashboard

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Two pushes in quick succession must not race to
# publish, and the older one losing is correct.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # NOT A TUNING CHOICE. actions/checkout defaults to depth 1, and
          # the generator reads `git log` for every completion date and for
          # the whole Activity tab. A depth-1 clone reports `1 commits` and
          # silently falls back to each brief's editable `Updated` field: a
          # plausible-looking page that is wrong, which is worse than
          # publishing nothing. The guard below refuses a shallow clone
          # because a flag can be dropped by an edit and a comment cannot fail.
          fetch-depth: 0

      - name: Check prerequisites
        run: |
          bash --version | head -1
          python3 --version

      - name: Generate the dashboard
        run: |
          mkdir -p _site
          bash skills/project-workflow/scripts/build-dashboard.sh \
            --root .ai \
            --out _site/index.html \
            --json _site/model.json

      # The trap this workflow was written around, checked rather than
      # trusted: a degraded history is the one failure that produces a
      # complete-looking page, so it must stop the deploy. The checks live in
      # the skill, so the GitHub and GitLab pipelines cannot disagree on them.
      - name: Refuse to publish a degraded page
        run: bash skills/project-workflow/scripts/publish-dashboard.sh guard --model _site/model.json --expect-shape numbered_task

      # The model is the generator's working data, not part of the page.
      # Leaving it published would put a second, unlabelled copy of every
      # figure on the web with nothing saying which one is authoritative.
      - name: Drop the model from what gets published
        run: rm -f _site/model.json

      # `enablement: true` turns Pages on the first time, so no manual
      # Settings step is needed. Creating a Pages site needs repository admin;
      # if the token lacks it this step fails loudly and a human enables Pages
      # once by hand - a documented fallback, not a silent skip.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
