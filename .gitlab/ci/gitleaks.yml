# Secret scanning on the GitLab origin (issue #3). Scans the full history of
# the pipeline's commit with .gitleaks.toml (default rules + reasoned
# allowlist). Separate from the dashboard job; meant as a merge gate alongside
# `validate`. The image is pinned by version AND digest.
gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks version
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --redact --no-banner --verbose -c .gitleaks.toml .
