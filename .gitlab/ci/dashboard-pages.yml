#
# Regenerate the delivery dashboard and publish it to GitLab Pages. The local
# file build-dashboard.sh writes is the canonical output; this is an optional
# copy of it on the web.
#
# A FRAGMENT, INCLUDED - NOT THE PROJECT'S CI FILE. A project's .gitlab-ci.yml
# is often its whole CI, so this job lives in its own file and is pulled in
# with `include: - local: .gitlab/ci/dashboard-pages.yml`. The renderer writes a stub
# .gitlab-ci.yml only where none exists, and never overwrites one.
#
# THE DASHBOARD IS A VIEW, NOT A GATE. A failed deploy fails this job; a
# dashboard reporting uncomfortable numbers fails nothing. Nothing here may
# ever become a condition on a merge.
pages:
  stage: deploy
  # Carries git, bash and python3. A shell-executor runner ignores `image` and
  # needs those three on its host instead.
  image: python:3.12
  variables:
    # NOT A TUNING CHOICE. GitLab clones 20 commits by default, not 1, so a
    # count-based check sees a healthy-looking history and passes it. The
    # generator reads `git log` for every completion date: a truncated clone
    # publishes a plausible page that is wrong. The guard asks git whether the
    # clone is shallow rather than inferring it from a number.
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  # One deploy at a time; a newer push supersedes an older one.
  resource_group: pages
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - bash --version | head -1
    - python3 --version
    - mkdir -p public
    - >-
      bash skills/project-workflow/scripts/build-dashboard.sh
      --root .ai
      --out public/index.html
      --json public/model.json
    - bash skills/project-workflow/scripts/publish-dashboard.sh guard --model public/model.json --expect-shape numbered_task
    # The model is working data, not part of the page (see the GitHub
    # template for why a second unlabelled copy of every figure is harmful).
    - rm -f public/model.json
  artifacts:
    paths:
      - public
