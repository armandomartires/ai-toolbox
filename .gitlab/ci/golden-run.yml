# The golden unattended run, on the Agent SDK runner (S018.T004; the runner is
# the Claude runner since 2026-11-14, docs/reports/2026-11-14-golden-run-comparison.md).
# Fixture: a throwaway calc.py repository, three dependent tasks
# (S001.T001 multiply, S001.T002 divide, S001.T003 power), a `unit` gate per
# task and `compile` as the long group. Built by
# skills/unattended-ops/templates/bindings/agent-sdk/tests/golden_fixture.py.
# Checked by scripts/check-sandbox-ci.py from tests/validate.sh.
#
# golden-run-dry: every MR and master pipeline, no secret, no network. Drives
#   runner.py against the stub claude_agent_sdk the runner's own suite uses, so
#   the plumbing (queue, gates, journal, closer, handover) is exercised in CI.
# golden-run-live: `when: manual`, never scheduled, master only. The one
#   secret is ANTHROPIC_API_KEY, a protected, masked project variable scoped
#   to the `golden-run-live` environment (ADR-0034: a CI variable holds only
#   what a CI job consumes). Spend is capped by the runner (--max-cost-usd,
#   the $10 the golden-run report used) and each role by its maxTurns.
#   Artifacts: the journal, progress.md and the role-result lines. No `env`,
#   no `set -x`, and a step drops the artifacts if they contain the key.

golden-run-dry:
  stage: test
  image: python:3.11
  tags: [docker]
  interruptible: true
  timeout: 15m
  cache: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - bash tests/test-golden-run.sh

golden-run-live:
  stage: test
  image: python:3.11
  tags: [docker]
  timeout: 1h
  interruptible: false
  resource_group: golden-run-live
  cache: []
  environment:
    name: golden-run-live
    action: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    GOLDEN_RUN_ID: "golden-$CI_PIPELINE_ID"
  script:
    - set -eu
    # Only ANTHROPIC_API_KEY is wanted; drop the job token and the other keys.
    - unset CI_JOB_TOKEN XAI_API_KEY OPENAI_API_KEY
    - bash scripts/sandbox/assert-sandbox.sh
    - apt-get update -qq && apt-get install -y -qq bubblewrap socat >/dev/null
    - test -n "${ANTHROPIC_API_KEY:-}" || { echo "ANTHROPIC_API_KEY is not set"; exit 1; }
    # Unpinned: no run has recorded a version that worked; pin it after the first
    # live CI run. A literal here, so no CI variable can swap the package.
    - python3 -m pip install --quiet claude-agent-sdk
    - git config --global user.email "golden-run@example.invalid"
    - git config --global user.name "Golden run (CI)"
    - work="$(mktemp -d)"
    - python3 scripts/emit-agents.py claude-code "$work/agents" --with-guard
    - python3 scripts/emit-agents.py --guard-json="$work/role-guard.json"
    - repo="$(python3 skills/unattended-ops/templates/bindings/agent-sdk/tests/golden_fixture.py build "$work" --agents "$work/agents" --guard "$PWD/configs/claude-code/hooks/role-guard.py" --guard-json "$work/role-guard.json")"
    - mkdir golden-live
    - rc=0; (cd "$repo" && python3 "$CI_PROJECT_DIR/skills/unattended-ops/templates/bindings/agent-sdk/runner.py" --binding binding.md --run-id "$GOLDEN_RUN_ID" --max-cost-usd 10) || rc=$?
    - cp "$repo/.run/$GOLDEN_RUN_ID/journal.jsonl" "$repo/.run/$GOLDEN_RUN_ID/progress.md" golden-live/ || true
    - grep -h '"role-result"' "$repo/.run/$GOLDEN_RUN_ID/journal.jsonl" > golden-live/role-results.jsonl || true
    # The key must not reach an artifact: drop them all if it did.
    - if printf '%s\n' "$ANTHROPIC_API_KEY" | grep -rqF -f - golden-live; then rm -rf golden-live; mkdir golden-live; echo "artifacts dropped, they held the key"; rc=1; fi
    - exit $rc
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - golden-live/journal.jsonl
      - golden-live/progress.md
      - golden-live/role-results.jsonl
