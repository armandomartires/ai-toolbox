# Gates server tests WITH the sandbox (issue #6). Runs on the docker runner
# (tag `docker`, runner 3). GATES_REQUIRE_SANDBOX=1 turns the bwrap test from
# skip-if-missing into must-run, so a runner that cannot sandbox fails here
# instead of passing silently.
gates-sandbox:
  stage: test
  image: python:3.11
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [mcp-servers/gates/**/*, .gitlab/ci/gates-sandbox.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GATES_REQUIRE_SANDBOX: "1"
  script:
    - apt-get update -qq && apt-get install -y -qq bubblewrap >/dev/null
    - pip install -q uv==0.13.6
    - cd mcp-servers/gates && uv run --frozen pytest -q -rs
