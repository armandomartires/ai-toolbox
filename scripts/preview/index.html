<html lang="en">

<title>Mod preview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="drawer" type="button" aria-controls="side" aria-expanded="true" title="Hide the sidebar (Ctrl+B)">
  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor"/><rect class="panel" x="2" y="3" width="4" height="10" rx="1.5" fill="currentColor"/><line x1="6.5" y1="2.5" x2="6.5" y2="13.5" stroke="currentColor"/></svg>
</button>
<nav id="side">
  <h1>MOD PREVIEW</h1>
  <div class="stamp" id="stamp"></div>
  <div id="list"></div>
  <label><input type="checkbox" id="outline"> outline boxes</label>
  <label><input type="checkbox" id="light"> light theme</label>
</nav>
<main id="main"></main>
<script src="scenes.js"></script>
<script src="render.js"></script>
<script src="snapshot.js"></script>
<script src="app.js"></script>
