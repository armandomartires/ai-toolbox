<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod preview</title>
<style>
  :root { --bg: #0e1013; --side: #15181c; --line: #2a2f36; --text: #e8ecef; --dim: #8a929c; --mark: #ff5f5a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; display: flex; min-height: 100vh; }
  nav { width: 260px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); padding: 12px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  nav h1 { font-size: 13px; margin: 0 0 4px; letter-spacing: .08em; }
  nav .stamp { color: var(--dim); font-size: 11px; margin-bottom: 12px; }
  nav h2 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 4px; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 4px 6px; border-radius: 4px; cursor: pointer; font: inherit; }
  nav button.on { background: #24303a; }
  nav label { display: flex; gap: 6px; align-items: center; color: var(--dim); margin-top: 12px; }
  main { flex: 1; padding: 16px; overflow: auto; }
  .scene { margin-bottom: 32px; }
  .scene h3 { font-size: 12px; color: var(--dim); font-weight: 500; margin: 0 0 6px; }
  .pane { position: relative; outline: 1px dashed var(--line); background: #1c2026; }
  .pane .fold { position: absolute; left: -6px; right: -6px; border-top: 1px dashed var(--mark); pointer-events: none; }
  .pane .fold span { position: absolute; right: 0; top: -15px; font-size: 10px; color: var(--mark); }
  .errors { white-space: pre-wrap; color: var(--mark); font: 12px/1.4 ui-monospace, monospace; background: #200; padding: 8px; }
  .desktop { font: 13px/20px system-ui, sans-serif; }
  .terminal { font: 13px/18px ui-monospace, Consolas, monospace; }
  .box { display: flex; min-width: 0; }
  .txt { white-space: pre-wrap; min-width: 0; }
  .btn { cursor: pointer; }
  .btn:not(.plain) { border: 1px solid #3a4048; border-radius: 4px; padding: 0 6px; }
  .outline .box { outline: 1px solid rgba(127, 231, 255, .18); }
  .unknown { border: 1px dashed var(--mark); color: var(--mark); font-size: 11px; padding: 2px; }
</style>
</head>
<body>
<nav>
  <h1>MOD PREVIEW</h1>
  <div class="stamp" id="stamp"></div>
  <div id="list"></div>
  <label><input type="checkbox" id="outline"> outline boxes</label>
</nav>
<main id="main"></main>
<script src="scenes.js"></script>
<script>
// Draws the test kit's trees (ui.drawn()) the way each surface lays them out:
// Box as flexbox, numbers as cells (the desktop's cell is 7.2px by 20px, as
// agent-watch's panel counts it; the terminal's one monospace character).
// An approximation of the surfaces, for layout and content, not pixels.
const CELL = { desktop: [7.2, 20], terminal: [7.8, 18] }
const SPACE = { xs: 0.25, sm: 0.5, md: 1, lg: 1.5, xl: 2 }
const SIZE = { caption: 11, footnote: 12, body: 13, heading: 15, title: 20 }
const WEIGHT = { regular: 400, medium: 500, semibold: 600, bold: 700 }

function draw(node, surface) {
  const [cw, rh] = CELL[surface]
  const x = v => (typeof v === 'number' ? v * cw + 'px' : typeof v === 'string' && SPACE[v] !== undefined ? SPACE[v] * cw + 'px' : v)
  const y = v => (typeof v === 'number' ? v * rh + 'px' : typeof v === 'string' && SPACE[v] !== undefined ? SPACE[v] * rh + 'px' : v)
  if (typeof node === 'string') return document.createTextNode(node)
  if (!node || typeof node !== 'object') return document.createTextNode('')
  const p = node.props || {}
  const kids = node.children || []
  let el
  if (node.type === 'Box') {
    el = document.createElement('div')
    el.className = 'box'
    const s = el.style
    s.flexDirection = p.flexDirection || 'row'
    if (p.flexGrow !== undefined) s.flexGrow = p.flexGrow
    s.flexShrink = p.flexShrink !== undefined ? p.flexShrink : 1
    if (p.flexWrap) s.flexWrap = p.flexWrap
    if (p.alignItems) s.alignItems = p.alignItems
    if (p.alignSelf) s.alignSelf = p.alignSelf
    if (p.justifyContent) s.justifyContent = p.justifyContent
    if (p.position) s.position = p.position
    for (const k of ['left', 'right']) if (p[k] !== undefined) s[k] = x(p[k])
    for (const k of ['top', 'bottom']) if (p[k] !== undefined) s[k] = y(p[k])
    if (p.width !== undefined) s.width = x(p.width)
    if (p.minWidth !== undefined) s.minWidth = x(p.minWidth)
    if (p.height !== undefined) s.height = y(p.height)
    if (p.minHeight !== undefined) s.minHeight = y(p.minHeight)
    const gap = p.gap
    if (p.columnGap !== undefined || gap !== undefined) s.columnGap = x(p.columnGap !== undefined ? p.columnGap : gap)
    if (p.rowGap !== undefined || gap !== undefined) s.rowGap = y(p.rowGap !== undefined ? p.rowGap : gap)
    for (const [side, horizontal] of [['Top', false], ['Bottom', false], ['Left', true], ['Right', true]]) {
      for (const kind of ['margin', 'padding']) {
        const v = p[kind + side] ?? (horizontal ? p[kind + 'X'] : p[kind + 'Y']) ?? p[kind]
        if (v !== undefined) s[kind + side] = horizontal ? x(v) : y(v)
      }
    }
    if (p.borderStyle) s.border = `1px solid ${p.borderColor || '#3a4048'}`
    if (p.borderStyle && surface === 'desktop' && p.borderStyle === 'round') s.borderRadius = '6px'
    if (p.backgroundColor) s.background = p.backgroundColor
    if (p.overflow) s.overflow = p.overflow
    if (p.display === 'none') s.display = 'none'
    if (p.key) el.title = p.key
  } else if (node.type === 'Text') {
    el = document.createElement('span')
    el.className = 'txt'
    const s = el.style
    if (p.color) s.color = p.color
    if (p.backgroundColor) s.background = p.backgroundColor
    if (p.dimColor) s.opacity = 0.6
    if (surface === 'desktop' && p.size) s.fontSize = SIZE[p.size] + 'px'
    if (p.weight) s.fontWeight = WEIGHT[p.weight]
    if (p.bold) s.fontWeight = 700
    if (p.italic) s.fontStyle = 'italic'
    if (p.underline) s.textDecoration = 'underline'
    if (p.strikethrough) s.textDecoration = 'line-through'
    if (p.tabular) s.fontVariantNumeric = 'tabular-nums'
    if (p.mono) s.fontFamily = 'ui-monospace, monospace'
    if (p.wrap && p.wrap.startsWith('truncate')) { s.whiteSpace = 'pre'; s.overflow = 'hidden'; s.textOverflow = 'ellipsis' }
  } else if (node.type === 'Button') {
    el = document.createElement('span')
    el.className = 'btn box' + (p.plain ? ' plain' : '')
    el.title = `Button ${p.key}${p.hotkey ? ' · ' + p.hotkey : ''}`
    if (!kids.length && p.label) el.append(p.label)
  } else if (node.type === 'Svg') {
    el = document.createElement('div')
    el.innerHTML = p.source || ''
    const svg = el.firstElementChild
    if (svg) { svg.setAttribute('width', p.width); svg.setAttribute('height', p.height) }
    el.title = p.alt || ''
    return el
  } else if (node.type === 'Raster') {
    return raster(p)
  } else if (node.type === 'Markdown' || node.type === 'Code') {
    el = document.createElement('pre')
    el.textContent = p.text || p.source || p.children || ''
    return el
  } else {
    el = document.createElement('div')
    el.className = 'unknown'
    el.textContent = node.type
  }
  for (const kid of kids) el.append(draw(kid, surface))
  return el
}

// A Raster's cells: 12 bytes each, a code point (u32, little-endian), then fg and bg as r, g, b and a flag (1: the default colour).
function raster(p) {
  const bytes = Uint8Array.from(atob(p.cells || ''), c => c.charCodeAt(0))
  const pre = document.createElement('div')
  pre.style.cssText = 'font: 13px/18px ui-monospace, Consolas, monospace; white-space: pre'
  for (let r = 0; r < p.rows; r++) {
    const line = document.createElement('div')
    for (let c = 0; c < p.columns; c++) {
      const at = (r * p.columns + c) * 12
      if (at + 12 > bytes.length) break
      const cp = bytes[at] | (bytes[at + 1] << 8) | (bytes[at + 2] << 16) | (bytes[at + 3] << 24)
      const span = document.createElement('span')
      span.textContent = String.fromCodePoint(cp || 32)
      if (bytes[at + 7] !== 1) span.style.color = `rgb(${bytes[at + 4]},${bytes[at + 5]},${bytes[at + 6]})`
      if (bytes[at + 11] !== 1) span.style.background = `rgb(${bytes[at + 8]},${bytes[at + 9]},${bytes[at + 10]})`
      line.append(span)
    }
    pre.append(line)
  }
  return pre
}

const data = window.PREVIEW || { scenes: [], errors: ['scenes.js did not load: run scripts/preview-mods.py'] }
let chosen = null
try { chosen = sessionStorage.getItem('scene') } catch {}

function show() {
  const main = document.getElementById('main')
  main.replaceChildren()
  if (data.errors.length) {
    const e = document.createElement('div')
    e.className = 'errors'
    e.textContent = data.errors.join('\n\n')
    main.append(e)
  }
  const list = chosen === null ? data.scenes : data.scenes.filter(s => `${s.mod}/${s.name}` === chosen)
  for (const s of list) {
    const [cw, rh] = CELL[s.surface]
    const wrap = document.createElement('section')
    wrap.className = 'scene'
    const h = document.createElement('h3')
    h.textContent = `${s.mod} · ${s.name} · ${s.columns}×${s.rows} cells`
    const pane = document.createElement('div')
    pane.className = `pane ${s.surface}`
    pane.style.width = s.columns * cw + 'px'
    pane.style.minHeight = s.rows * rh + 'px'
    pane.append(draw(s.tree, s.surface))
    // Where the pane's body ends: what lies below it scrolls.
    const fold = document.createElement('div')
    fold.className = 'fold'
    fold.style.top = s.rows * rh + 'px'
    fold.innerHTML = '<span>pane height</span>'
    pane.append(fold)
    wrap.append(h, pane)
    main.append(wrap)
  }
}

function menu() {
  const list = document.getElementById('list')
  list.replaceChildren()
  const all = document.createElement('button')
  all.textContent = 'All scenes'
  all.className = chosen === null ? 'on' : ''
  all.onclick = () => pick(null)
  list.append(all)
  let mod = ''
  for (const s of data.scenes) {
    if (s.mod !== mod) {
      mod = s.mod
      const h = document.createElement('h2')
      h.textContent = mod
      list.append(h)
    }
    const b = document.createElement('button')
    const id = `${s.mod}/${s.name}`
    b.textContent = s.name
    b.className = chosen === id ? 'on' : ''
    b.onclick = () => pick(id)
    list.append(b)
  }
}

function pick(id) {
  chosen = id
  try { id === null ? sessionStorage.removeItem('scene') : sessionStorage.setItem('scene', id) } catch {}
  menu()
  show()
}

document.getElementById('outline').onchange = e => document.body.classList.toggle('outline', e.target.checked)
document.getElementById('stamp').textContent = data.stamp ? 'built ' + new Date(Number(data.stamp) * 1000).toLocaleTimeString() : ''
if (chosen !== null && !data.scenes.some(s => `${s.mod}/${s.name}` === chosen)) chosen = null
menu()
show()

// Served (--serve), the page reloads itself after each rebuild.
if (location.protocol.startsWith('http')) {
  setInterval(async () => {
    try {
      const now = await (await fetch('version.txt', { cache: 'no-store' })).text()
      if (data.stamp && now.trim() !== data.stamp) location.reload()
    } catch {}
  }, 1000)
}
</script>
</body>
</html>
